# Publicação: disparada quando uma Release do GitHub é publicada (ou seja,
# quando a PR de release criada pelo release-please é aprovada/mergada).
# Publica no npm com provenance e anexa o tarball à Release do repositório.
# workflow_dispatch permite republicar manualmente (ex.: se uma run falhou).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      # npm ci também executa o build via script prepare.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --runInBand
      - name: Test package
        run: npm run test:package

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A tag é derivada da versão do package.json para funcionar tanto no
      # evento de release quanto em execuções manuais via workflow_dispatch.
      - name: Attach tarball to GitHub Release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          gh release upload "$TAG" dist/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
